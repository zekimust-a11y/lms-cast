<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Now Playing - Lyr</title>
    <style>
      /* Inline Google Fonts CSS so the receiver doesn't need fonts.googleapis.com.
         Some Cast devices/networks block googleapis but allow fonts.gstatic.com. */
      /* cyrillic-ext */
      @font-face {
        font-family: 'Raleway';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/raleway/v37/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVs9pbCFPrEHJA.woff2) format('woff2');
        unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
      }
      /* cyrillic */
      @font-face {
        font-family: 'Raleway';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/raleway/v37/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVs9pbCMPrEHJA.woff2) format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      /* vietnamese */
      @font-face {
        font-family: 'Raleway';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/raleway/v37/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVs9pbCHPrEHJA.woff2) format('woff2');
        unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      /* latin-ext */
      @font-face {
        font-family: 'Raleway';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/raleway/v37/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVs9pbCGPrEHJA.woff2) format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* latin */
      @font-face {
        font-family: 'Raleway';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/raleway/v37/1Ptxg8zYS_SKggPN4iEgvnHyvveLxVs9pbCIPrE.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
          /* Display styles (cassette deck, VU meters, ...) from Lyr's shared
         renderer. Chosen in Lyr > Settings > TV Display; the Core sends it as
         display_view on every NOW_PLAYING. */
      #display-view {
        position: fixed;
        inset: 0;
        /* Above the classic layout (bottom bar and message are 10), below the
           volume overlay (20). At 5 the classic bar painted over the style. */
        z-index: 15;
        background: #000;
      }
      #display-view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      // Cache-bust the receiver URL (Chromecast can aggressively cache GitHub Pages)
      try {
        const hasV = /[?&]v=/.test(location.search);
        if (!hasV) {
          const sep = location.search ? '&' : '?';
          location.replace(location.pathname + location.search + sep + 'v=' + Date.now() + location.hash);
        }
      } catch (e) {
        // ignore
      }
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        /* Match Lyriq web typography where possible */
        font-family: QobuzSans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        overflow: hidden;
        background: #000;
        color: #fff;
      }

      .build-badge {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 9999;
        font-size: 12px;
        letter-spacing: 0.4px;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.18);
        padding: 6px 10px;
        border-radius: 999px;
        user-select: none;
        pointer-events: none;
        display: none;
      }

      /* Big, obvious, center-screen test badge to confirm correct receiver HTML */
      .build-badge-center {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 9999;
        font-size: clamp(22px, 4vw, 54px);
        font-weight: 700;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.95);
        background: rgba(0, 0, 0, 0.65);
        border: 2px solid rgba(255, 255, 255, 0.25);
        padding: 18px 26px;
        border-radius: 18px;
        text-align: center;
        user-select: none;
        pointer-events: none;
        backdrop-filter: blur(10px);
        opacity: 1;
        transition: opacity 1.2s ease;
        display: none;
      }

      .build-badge-center.fade-out {
        opacity: 0;
      }

      body.debug .build-badge,
      body.debug .build-badge-center {
        display: block;
      }

      .background-layer {
        position: fixed;
        inset: 0;
        background-size: cover;
        /* Top-align so faces/heads don't get cropped off on TV overscan */
        background-position: center top;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
        will-change: opacity;
      }

      .background-layer.active {
        opacity: 1;
      }

      .background-layer.blurred {
        filter: blur(40px) brightness(0.35);
        transform: scale(1.08);
      }

      .background-overlay {
        position: fixed;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.15) 0%,
          rgba(0, 0, 0, 0.55) 55%,
          rgba(0, 0, 0, 0.9) 100%
        );
        z-index: 2;
      }

      .bottom-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 32px 60px 40px;
        display: flex;
        gap: 48px;
        align-items: flex-end;
        z-index: 10;
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      .bottom-bar.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .artwork-container {
        width: 33vh;
        height: 33vh;
        max-width: 442px;
        flex-shrink: 0;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .artwork {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.6s ease;
      }

      .artwork.loaded {
        opacity: 1;
      }

      .info {
        flex: 1;
        min-width: 0;
      }

      .title {
        font-size: 2.184rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .artist-text {
        font-size: 1.3rem;
        color: rgba(255, 255, 255, 0.8);
        margin-bottom: 16px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .progress-row {
        display: flex;
        align-items: center;
        /* Modest gap so the waveform fills most of the span between the time
           markers without crowding them. */
        gap: 16px;
      }

      .time {
        width: 56px;
        font-variant-numeric: tabular-nums;
        color: rgba(255, 255, 255, 0.75);
        display: inline-flex;
        align-items: center;
        line-height: 1;
        min-height: 1em;
      }

      /* Start time hugs the LEFT edge of its box so it lines up exactly with
         the title/artist; duration hugs the right edge to line up with the
         right edge of the strip. */
      .time.current {
        justify-content: flex-start;
        text-align: left;
      }

      .time.duration {
        justify-content: flex-end;
        text-align: right;
      }

      .progress-container {
        flex: 1;
        height: 3px;
        display: flex;
        align-items: center;
        position: relative;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #ffffff, rgba(255, 255, 255, 0.9));
        border-radius: 3px;
        /* Driven per-frame by the interpolated playhead clock; no CSS easing
           (a transition would lag/smear behind the rAF updates). */
        width: 0%;
      }

      /* Local-file waveform (replaces the plain progress bar when available) */
      .waveform {
        flex: 1;
        height: 30px;
        display: block;
      }
      .waveform.hidden,
      .progress-container.hidden {
        display: none;
      }

      .not-playing-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        opacity: 1;
        transition: opacity 0.3s ease;
      }

      .not-playing-container.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .not-playing {
        text-align: center;
      }

      .not-playing h2 {
        /* Splash/title: make Lyriq much larger */
        font-size: 5.92rem; /* 26% smaller than 8rem */
        font-family: Raleway, QobuzSans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: -1px;
        margin-bottom: 12px;
      }

      .not-playing p {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.7);
      }

      #volume-overlay {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        /* Keep the overlay consistently narrow (avoid jumping between square/wide) */
        width: 180px;
        padding: 22px 26px;
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 20;
      }

      #volume-overlay.visible {
        opacity: 1;
      }

      .volume-icon {
        font-size: 3rem;
      }

      .volume-text {
        font-size: 4.5rem;
        font-weight: 200;
        width: 100%;
        text-align: center;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      #volume-overlay.muted .volume-text {
        font-size: 2.2rem;
        letter-spacing: 3px;
        font-weight: 600;
        color: #ff6666;
      }

      /* Cast devices often report ~960px CSS width on 1080p TVs; keep desktop layout for TV. */
      @media (max-width: 850px) {
        .bottom-bar {
          flex-direction: column;
          align-items: center;
        }

        .artwork-container {
          width: 55vw;
          height: 55vw;
        }

        .info {
          width: 100%;
        }

        .title {
          font-size: 1.68rem;
          text-align: center;
        }

        .artist-text {
          text-align: center;
        }

        .progress-row {
          flex-direction: column;
          gap: 10px;
        }

        .progress-container {
          width: 100%;
        }

        .time {
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="build-badge" id="build-badge">Lyryq Receiver</div>
    <div class="build-badge-center" id="build-badge-center">Lyryq Receiver</div>
    <div id="bg-layer-0" class="background-layer active"></div>
    <div id="bg-layer-1" class="background-layer"></div>
    <div class="background-overlay"></div>

    <div class="not-playing-container" id="not-playing-container">
      <div class="not-playing">
        <h2 id="not-playing-title"></h2>
      </div>
    </div>

    <div class="bottom-bar hidden">
      <div class="artwork-container">
        <img id="album-art" class="artwork" alt="Album art" />
      </div>
      <div class="info">
        <h1 class="title"></h1>
        <p class="artist-text"></p>
        <div class="progress-row">
          <span class="time current">0:00</span>
          <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <canvas class="waveform hidden" id="waveform"></canvas>
          <span class="time duration">0:00</span>
        </div>
      </div>
    </div>

    <div id="display-view" hidden>
      <canvas id="display-canvas"></canvas>
    </div>

    <div id="volume-overlay">
      <div id="volume-icon" class="volume-icon">🔊</div>
      <div id="volume-value" class="volume-text">0</div>
    </div>

    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <!-- A copy of lyriqapp's server/templates/tv-displays/renderer.js. This page
         is https and cannot load it from an http Core, so it ships here; keep the
         two identical (lyriqapp: scripts/cast/sync-renderer.sh). -->
    <script>
      // Loaded with a cache-buster: GitHub Pages lets the device keep files for
      // 10 minutes, and a Chromecast kept running an old renderer after a
      // publish (old turntable, no lyrics/clock/spectrum). Styles appear from
      // the first NOW_PLAYING after it loads; until then Classic shows.
      (function () {
        var s = document.createElement('script');
        s.src = 'tv-displays/renderer.js?t=' + Date.now();
        s.onload = function () { window.__rendererLoadedAt = Date.now(); };
        s.onerror = function () { window.__rendererLoadError = 'renderer.js failed to load'; };
        document.head.appendChild(s);
      })();
    </script>
    <script>
      const CAST_NAMESPACE = 'urn:x-cast:com.zeki.rooncast';
      const context = cast.framework.CastReceiverContext.getInstance();
      const options = new cast.framework.CastReceiverOptions();
      options.disableIdleTimeout = true;
      
      // Prevent Chromecast/CAF from showing the default "media receiver" UI.
      // We are NOT casting audio/video; this receiver is display-only and driven by custom NOW_PLAYING messages.
      try {
        const playerManager = context.getPlayerManager();
        playerManager.setMessageInterceptor(
          cast.framework.messages.MessageType.LOAD,
          (loadRequestData) => {
            console.log('[Receiver] Ignoring MEDIA LOAD request');
            return null;
          }
        );
      } catch (e) {
        // ignore
      }
      context.addCustomMessageListener(CAST_NAMESPACE, (event) => handleMessage(event.data));
      
      // Listen for sender disconnect to stop timers
      context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, (event) => {
        console.log('Sender disconnected, stopping playback');
        stopPlayback();
      });
      
      context.start(options);

      const bgLayers = [
        document.getElementById('bg-layer-0'),
        document.getElementById('bg-layer-1')
      ];
      const titleEl = document.querySelector('.title');
      const artistEl = document.querySelector('.artist-text');
      const currentTimeEl = document.querySelector('.time.current');
      const durationEl = document.querySelector('.time.duration');
      const progressBar = document.getElementById('progress-bar');
      const progressContainer = document.querySelector('.progress-container');
      const waveformCanvas = document.getElementById('waveform');
      const waveformCtx = waveformCanvas ? waveformCanvas.getContext('2d') : null;
      let currentBars = null;
      const albumArt = document.getElementById('album-art');
      const bottomBar = document.querySelector('.bottom-bar');
      const notPlayingContainer = document.getElementById('not-playing-container');
      const notPlayingTitle = document.getElementById('not-playing-title');
      // Subtitle removed; keep only the large "Lyriq" splash.
      const volumeOverlay = document.getElementById('volume-overlay');
      const volumeIcon = document.getElementById('volume-icon');
      const volumeValue = document.getElementById('volume-value');

      let lastTrackId = '';
      let lastAlbumImage = null;
      let lastAlbumBackground = null;
      let lastArtistImagesKey = '';
      let lastPayload = null;
      // Smooth interpolated playhead clock (driven by requestAnimationFrame).
      // NOW_PLAYING payloads arrive on irregular poll intervals, so we anchor a
      // local clock to each reported seek and advance it continuously between
      // updates instead of stepping once per payload/second.
      let rafId = null;
      const playClock = {
        seek: 0,
        anchorPerf: 0,
        duration: 0,
        playing: false,
        anchored: false,
      };
      let activeBackgroundLayer = 0;
      let lastVolume = null;
      let lastMute = null;
      let volumeTimer = null;
      let artistImages = [];
      let rotationTimer = null;
      let bgLoadInProgress = false;
      let bgCurrentLoad = null;
      let bgCurrentLoadTimeout = null;
      let rotationIndex = 0;
      // Rotate artist backgrounds every 25 seconds (as requested).
      const BACKGROUND_ROTATION_MS = 25000;
      // Filter out low-res artist/fanart backgrounds (TV looks bad otherwise).
      // These thresholds are conservative: if we can't get a reasonably large image, we fall back to album art.
      const MIN_BG_WIDTH = 900;
      const MIN_BG_HEIGHT = 500;

      function isLikelyLowResUrl(url) {
        try {
          const u = String(url || '');
          // Common CDN sizing patterns we see (esp. thumbnails).
          if (/\b(80|96|120|128|160|200|240|256|300|320|400)x\1\b/i.test(u)) return true;
          if (/[?&](w|width)=(80|96|120|128|160|200|240|256|300|320|400)\b/i.test(u)) return true;
          if (/[?&](h|height)=(80|96|120|128|160|200|240|256|300|320|400)\b/i.test(u)) return true;
          return false;
        } catch {
          return false;
        }
      }

      function canonicalizeUrl(url) {
        try {
          const raw = String(url || '').trim();
          if (!raw) return '';
          // Only normalize absolute URLs; for anything else fallback to string cleanup.
          if (!/^https?:\/\//i.test(raw)) {
            return raw.replace(/[?&](v|t|ts|cacheBust|cb|rnd|_)=\d+/gi, '');
          }
          const u = new URL(raw);
          // Strip common cache-busters that can change frequently (causes rotation to reset).
          // NOTE: keep "_" because some CDNs use it for non-cache semantics.
          const strip = ['v', 't', 'ts', 'cacheBust', 'cb', 'rnd'];
          for (const k of strip) u.searchParams.delete(k);
          // Normalize param ordering to get stable comparisons.
          const entries = Array.from(u.searchParams.entries()).sort(([a], [b]) => a.localeCompare(b));
          u.search = entries.length ? `?${entries.map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&')}` : '';
          u.hash = '';
          return u.toString();
        } catch {
          return String(url || '').trim();
        }
      }

      function makeCanonicalListKey(list) {
        const arr = Array.isArray(list) ? list : [];
        const uniq = Array.from(
          new Set(
            arr
              .filter(Boolean)
              .map((u) => canonicalizeUrl(u))
              .filter(Boolean)
          )
        );
        uniq.sort();
        return uniq.join('|');
      }

      // Debug overlays only when explicitly requested
      try {
        const params = new URLSearchParams(location.search);
        const debug = params.get('debug') === '1';
        if (debug) document.body.classList.add('debug');
        const v = params.get('v') || 'no-v';
        const badge = document.getElementById('build-badge');
        if (badge) badge.textContent = `Lyryq Receiver v=${v}`;
        const badgeCenter = document.getElementById('build-badge-center');
        if (badgeCenter) {
          badgeCenter.textContent = `Lyryq Receiver\\nv=${v}`;
          setTimeout(() => badgeCenter.classList.add('fade-out'), 8000);
        }
      } catch (e) {
        // ignore
      }

      function handleMessage(data) {
        if (!data) return;
        if (data.type === 'NOW_PLAYING' || data.type === 'STATE') {
          applyNowPlaying(data.payload || {});
        } else if (data.type === 'DIAG_REQUEST') {
          sendDiag('request', true);
        } else if (data.type === 'PAUSE') {
          console.log('Received PAUSE command, resetting display');
          resetDisplay();
        } else if (data.type === 'VOLUME') {
          // Explicit volume update message (e.g., from Roon volume endpoint)
          try {
            const vol = data.payload?.output?.volume ?? data.payload?.volume ?? null;
            // IMPORTANT: For explicit VOLUME messages, show immediately even if this is the first
            // volume value we’ve seen (e.g., when LMS digital volume control is off and NOW_PLAYING
            // payloads do not include output.volume).
            handleVolumeOverlay(vol, { forceShow: true });
          } catch (e) {
            // ignore
          }
        }
      }

      // --- Receiver diagnostics ------------------------------------------------
      // This device has no remote debugging, so the receiver reports what it
      // is and what went wrong to the Core, which shows the last report in
      // /api/cast/diagnostics (receiverDiag).
      const diagErrors = [];
      function noteDiagError(where, e) {
        const msg = where + ': ' + (e && (e.stack || e.message) ? String(e.stack || e.message) : String(e));
        diagErrors.push(msg.slice(0, 500));
        while (diagErrors.length > 8) diagErrors.shift();
      }
      window.addEventListener('error', (ev) => { noteDiagError('error', ev.error || ev.message); sendDiag('error'); });
      window.addEventListener('unhandledrejection', (ev) => { noteDiagError('rejection', ev.reason); sendDiag('rejection'); });

      // Draw a centred "M" on a scratch canvas and find where it landed: an
      // empirical check of textAlign and font loading on this browser.
      function textProbe() {
        try {
          const c = document.createElement('canvas');
          c.width = 400; c.height = 80;
          const x = c.getContext('2d');
          x.fillStyle = '#000'; x.fillRect(0, 0, 400, 80);
          x.fillStyle = '#fff'; x.font = '800 60px "Big Shoulders Display", "Arial Narrow", sans-serif';
          x.textAlign = 'center'; x.textBaseline = 'middle';
          x.fillText('MMM', 200, 40);
          const d = x.getImageData(0, 0, 400, 80).data;
          let lo = 400, hi = -1;
          for (let col = 0; col < 400; col++) {
            for (let row = 0; row < 80; row++) {
              if (d[(row * 400 + col) * 4] > 128) { if (col < lo) lo = col; if (col > hi) hi = col; break; }
            }
          }
          const measured = x.measureText('MMM').width;
          return { inkLeft: lo, inkRight: hi, inkCentre: hi >= 0 ? (lo + hi) / 2 : null, expectCentre: 200, measureWidth: Math.round(measured), textAlignAfter: x.textAlign };
        } catch (e) {
          return { error: String(e && e.message || e) };
        }
      }

      function sendDiag(reason, withSnapshot) {
        try {
          const lib = window.LyrDisplays;
          const cv = document.getElementById('display-canvas');
          const r = cv ? cv.getBoundingClientRect() : null;
          const proto = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
          const fontsOk = (f) => { try { return document.fonts ? document.fonts.check(f) : null; } catch (e) { return null; } };
          context.sendCustomMessage(CAST_NAMESPACE, undefined, {
            type: 'RECEIVER_DIAG',
            reason: String(reason || ''),
            ua: navigator.userAgent,
            screen: { w: window.screen && screen.width, h: window.screen && screen.height },
            inner: { w: window.innerWidth, h: window.innerHeight },
            dpr: window.devicePixelRatio,
            hidden: document.hidden,
            renderer: lib ? { views: lib.VIEWS.map((v) => v.id), loadedAt: window.__rendererLoadedAt || null } : { missing: true, error: window.__rendererLoadError || null },
            view: displayKey || null,
            canvas: cv ? { w: cv.width, h: cv.height, css: r ? { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) } : null } : null,
            features: proto ? {
              roundRect: typeof proto.roundRect === 'function',
              conic: typeof proto.createConicGradient === 'function',
              letterSpacing: 'letterSpacing' in proto,
              filter: 'filter' in proto,
              resizeObserver: typeof window.ResizeObserver === 'function',
            } : null,
            fonts: {
              status: document.fonts ? document.fonts.status : null,
              bigShoulders: fontsOk('800 20px "Big Shoulders Display"'),
              plexSans: fontsOk('500 20px "IBM Plex Sans"'),
              plexMono: fontsOk('500 20px "IBM Plex Mono"'),
            },
            textProbe: textProbe(),
            errors: diagErrors.slice(),
            // A small JPEG of what the style canvas shows, on request only.
            snapshot: withSnapshot && cv && !document.getElementById('display-view').hidden ? (() => {
              try {
                const t = document.createElement('canvas');
                t.width = 640; t.height = 360;
                t.getContext('2d').drawImage(cv, 0, 0, 640, 360);
                return t.toDataURL('image/jpeg', 0.72);
              } catch (e) { return 'snapshot failed: ' + String(e && e.message || e); }
            })() : null,
          });
        } catch (e) {
          // nothing else to do from here
        }
      }
      setTimeout(() => sendDiag('start'), 4000);

      // --- Display styles -----------------------------------------------------
      const displayViewEl = document.getElementById('display-view');
      const displayCanvas = document.getElementById('display-canvas');
      let displayRenderer = null;
      let displayKey = '';
      let displayLevelsKey = '';
      let displaySpectrumKey = '';
      let displayLyricsKey = '';
      // The last style the Core asked for, so a PAUSE (which carries no
      // payload) can keep the clock up as a standby screen.
      let lastDisplayView = '';

      function hideDisplayStyle() {
        if (displayViewEl) displayViewEl.hidden = true;
      }

      function codecName(type) {
        const t = String(type || '').trim().toLowerCase().replace(/\s*radio$/, '');
        const map = { flc: 'FLAC', alc: 'ALAC', aif: 'AIFF', ops: 'OPUS', ogf: 'OGG', wvp: 'WAV', pcm: 'WAV', dsf: 'DSD', dff: 'DSD' };
        return map[t] || t.toUpperCase();
      }

      // Returns true when a style owns the screen for this payload.
      function applyDisplayStyle(payload, info) {
        const lib = window.LyrDisplays;
        const view = String(payload.display_view || 'classic');
        const variant = String(payload.display_variant || '');
        const known = !!(lib && lib.VIEWS && lib.VIEWS.some((v) => v.id === view));
        if (!known) {
          if (displayRenderer) {
            displayRenderer.destroy();
            displayRenderer = null;
            displayKey = '';
            displayLevelsKey = '';
            displaySpectrumKey = '';
            displayLyricsKey = '';
          }
          hideDisplayStyle();
          return false;
        }
        const key = view + '|' + variant;
        if (!displayRenderer) {
          // Chromecast GPUs are weak: 30 fps is plenty for needles and reels.
          displayRenderer = lib.create(displayCanvas, { view, variant: variant || undefined, maxFps: 30 });
          displayLevelsKey = '';
          displaySpectrumKey = '';
          displayLyricsKey = '';
        } else if (key !== displayKey) {
          displayRenderer.setView(view, variant || undefined);
        }
        if (key !== displayKey) setTimeout(() => sendDiag('view ' + key), 2500);
        displayKey = key;
        const audio = payload.audio || {};
        displayRenderer.setTrack({
          title: info.title,
          artist: info.artist,
          album: info.album,
          artworkUrl: info.artwork || '',
          codec: codecName(audio.codec),
          bitDepth: audio.bit_depth || undefined,
          sampleRate: audio.sample_rate || undefined,
        });
        displayRenderer.setPosition(info.seek, info.playing, info.duration);
        // Levels ride on the payload once the Core has analysed the track.
        const lv = payload.levels;
        const lvKey = lv && lv.data ? info.trackId + '|' + lv.bucketSeconds + '|' + lv.data.length : info.trackId + '|none';
        if (lvKey !== displayLevelsKey) {
          displayLevelsKey = lvKey;
          displayRenderer.setLevels(lv && lv.data ? lib.decodeLevels(lv) : null);
        }
        // Lyrics for the lyrics style (the Core resolves and sends them).
        const ly = payload.lyrics;
        const lyKey = info.trackId + '|' + (ly ? (ly.synced || ly.plain || '').length + (ly.instrumental ? 'i' : '') : 'none');
        if (lyKey !== displayLyricsKey && typeof displayRenderer.setLyrics === 'function') {
          displayLyricsKey = lyKey;
          displayRenderer.setLyrics(ly ? { synced: ly.synced || null, plain: ly.plain || null, instrumental: !!ly.instrumental } : null);
        }
        // Spectrum bands, when the Core has analysed them (older renderers
        // without setSpectrum simply ignore it).
        const sp = payload.spectrum;
        const spKey = sp && sp.data ? info.trackId + '|' + sp.bucketSeconds + '|' + sp.data.length : info.trackId + '|none';
        if (spKey !== displaySpectrumKey && typeof displayRenderer.setSpectrum === 'function') {
          displaySpectrumKey = spKey;
          displayRenderer.setSpectrum(sp && sp.data && lib.decodeSpectrum ? lib.decodeSpectrum(sp) : null);
        }
        displayViewEl.hidden = false;
        return true;
      }

      // Clock is a standby screen: keep it up, showing just the time, when the
      // music pauses or stops. Every other style resets as before.
      function keepClockOnIdle() {
        if (lastDisplayView !== 'clock' || !displayRenderer) return false;
        displayRenderer.setTrack({ title: '', artist: '' });
        displayRenderer.setPosition(0, false, 0);
        displayViewEl.hidden = false;
        return true;
      }

      function applyNowPlaying(payload) {
        if (payload && payload.display_view) lastDisplayView = String(payload.display_view);
        const state = payload.state || 'idle';
        const isPlaying = state === 'playing';
        const isLoading = state === 'loading';
        const nowPlaying = payload.now_playing || null;

        // If paused, show the splash screen instead of a stale track.
        if (state === 'paused') {
          console.log('[Receiver] Paused, showing splash');
          resetDisplay();
          return;
        }

        // During loading/transitions, keep the last display
        if (isLoading && !nowPlaying && lastPayload) {
          return;
        }

        // If no nowPlaying but not explicitly idle/stopped/paused, keep last display (track change transition)
        if (!nowPlaying && state !== 'idle' && state !== 'stopped' && state !== 'paused' && lastPayload && lastPayload.now_playing) {
          console.log('[Receiver] Keeping last display during transition, state:', state);
          return;
        }

        lastPayload = payload;

        if (nowPlaying) {
          // Show the bottom bar when we have content
          bottomBar.classList.remove('hidden');
          if (notPlayingContainer) notPlayingContainer.classList.add('hidden');
          
          const trackId = String(payload.track_key || `${nowPlaying.one_line?.line1 || ''}-${nowPlaying.two_line?.line1 || ''}`);
          let artistName = nowPlaying.two_line?.line2 || '';
          // If multiple artists separated by slashes, show only the primary artist
          if (artistName.includes(' / ')) {
            artistName = artistName.split(' / ')[0].trim();
          }
          const trackTitle = nowPlaying.two_line?.line1 || nowPlaying.one_line?.line1 || 'Unknown track';
          const duration = nowPlaying.length || 0;
          const seek = payload.seek_position || 0;

          titleEl.textContent = trackTitle;
          artistEl.textContent = artistName;
          durationEl.textContent = formatTime(duration);
          setWaveform(payload);
          // Smoothly drive the time + progress from an interpolated clock so the
          // playhead doesn't jump on irregular NOW_PLAYING poll intervals.
          syncPlayClock(seek, duration, isPlaying);

          // The Core sends its "Lyr" SVG placeholder rather than an empty field
          // when a track has no artwork, so a receiver that ignored empty
          // payloads could not stick on the previous track's cover. We want the
          // no-artwork guarantee without the branded glyph: treat the placeholder
          // as the absence it stands for, and let the isNewTrack branch below do
          // the clearing. This is also what the `/now-playing` web page shows for
          // the same track, which is the point.
          const rawAlbumImage = payload.image_data || null;
          const rawAlbumBackground = payload.image_url || rawAlbumImage;
          const albumImage = isPlaceholderArtwork(rawAlbumImage) ? null : rawAlbumImage;
          const albumBackground = isPlaceholderArtwork(rawAlbumBackground) ? null : rawAlbumBackground;
          coreBackdropColor = parseHexColor(payload.background_color);
          // Album art <img> should use whichever artwork URL we have (image_data or image_url).
          const albumArtSrc = albumImage || albumBackground || null;

          // IMPORTANT: payloads can arrive in stages (especially right after casting starts):
          // sometimes we get a NOW_PLAYING update without artist_images/artwork even though they
          // exist. Never "downgrade" the background (artist -> default) just because a later
          // payload omits these fields.
          const hasArtistImagesField = Array.isArray(payload.artist_images);
          const artistImageList = hasArtistImagesField ? payload.artist_images : null;
          const nextArtistImagesKey = hasArtistImagesField ? makeCanonicalListKey(artistImageList) : null;

          // If we've ever had artist images for the current track, DO NOT downgrade the background
          // just because later payloads omit artist_images or send an empty list.
          const hasNonEmptyArtistUpdate = hasArtistImagesField && Array.isArray(artistImageList) && artistImageList.length > 0;
          const keepExistingArtistImages =
            trackId === lastTrackId && lastArtistImagesKey && lastArtistImagesKey.length > 0 && !hasNonEmptyArtistUpdate;

          const artistImagesKey = keepExistingArtistImages
            ? lastArtistImagesKey
            : (nextArtistImagesKey === null ? lastArtistImagesKey : nextArtistImagesKey);
          const canonicalAlbumImage = albumImage ? canonicalizeUrl(albumImage) : null;
          const canonicalAlbumBackground = albumBackground ? canonicalizeUrl(albumBackground) : null;
          const artworkChanged =
            (canonicalAlbumImage && canonicalAlbumImage !== lastAlbumImage) ||
            (canonicalAlbumBackground && canonicalAlbumBackground !== lastAlbumBackground);
          const artistImagesChanged = artistImagesKey !== lastArtistImagesKey;

          // Update artwork/background not only on track change, but also when we receive a richer payload
          // for the same track (common right after casting starts).
          // Prevent a downgrade: if we already had artist images for this track, and the new payload
          // explicitly has none (or is missing the field), keep the existing rotation/background.
          const nextArtistListEmpty = hasArtistImagesField && (!artistImageList || artistImageList.length === 0);
          const wouldDowngradeArtistImages =
            trackId === lastTrackId && lastArtistImagesKey && lastArtistImagesKey.length > 0 && (nextArtistListEmpty || !hasArtistImagesField);

          const isNewTrack = trackId !== lastTrackId;
          if (isNewTrack || artworkChanged || (artistImagesChanged && !wouldDowngradeArtistImages)) {
            console.log('[Receiver] Track changed:', trackTitle);
            lastTrackId = trackId;
            lastAlbumImage = canonicalAlbumImage;
            lastAlbumBackground = canonicalAlbumBackground;
            lastArtistImagesKey = artistImagesKey;
            // Never show a "placeholder" by clearing album art on partial payloads.
            // Prefer keeping the previous image unless we have a new one (or track changed).
            if (albumArtSrc) {
              setAlbumArt(albumArtSrc);
            } else if (isNewTrack) {
              // A genuinely different track with no artwork should NOT keep the
              // previous track's cover. Clear to a clean empty box (no stale art,
              // no branded placeholder). Same-track partial payloads still keep
              // whatever art we already have.
              setAlbumArt(null);
            }
            // Only update background sources if we have a real list update, or if artwork changed.
            // This prevents switching to "no images" default during staged payloads.
            if (!wouldDowngradeArtistImages && !keepExistingArtistImages) {
              updateBackgroundSources(artistImageList || [], albumBackground, albumImage);
            }
          }

          try {
          applyDisplayStyle(payload, {
            trackId,
            title: trackTitle,
            artist: artistName,
            album: nowPlaying.three_line?.line3 || '',
            artwork: albumArtSrc,
            seek,
            duration,
            playing: isPlaying,
          });
          } catch (e) {
            // A style that throws must not take the whole screen with it.
            noteDiagError('applyDisplayStyle', e);
            hideDisplayStyle();
            sendDiag('style-error');
          }

          // Show volume overlay when volume changes (same behavior as roon-cast receiver)
          handleVolumeOverlay(payload.output?.volume);
        } else if (state === 'idle' || state === 'stopped' || state === 'paused') {
          // Only reset display for explicit idle/stopped/paused states
          console.log('[Receiver] Resetting display, state:', state);
          resetDisplay();
        }
      }

      function perfNow() {
        return window.performance && performance.now
          ? performance.now()
          : Date.now();
      }

      // Current interpolated playhead position (seconds).
      function currentSeek() {
        if (!playClock.playing) return playClock.seek;
        const s = playClock.seek + (perfNow() - playClock.anchorPerf) / 1000;
        return playClock.duration > 0
          ? Math.min(s, playClock.duration)
          : Math.max(0, s);
      }

      // Anchor the local clock to a reported seek. We only hard-resync when the
      // local clock has drifted meaningfully from what LMS reports (a real seek
      // or buffer correction), so normal poll jitter doesn't yank the playhead.
      function syncPlayClock(reportedSeek, duration, playing) {
        playClock.duration = duration || 0;
        const now = perfNow();
        const predicted =
          playClock.anchored && playClock.playing
            ? playClock.seek + (now - playClock.anchorPerf) / 1000
            : reportedSeek;
        const drift = Math.abs(reportedSeek - predicted);
        const resuming = playing && !playClock.playing;
        if (!playClock.anchored || resuming || drift > 1.25) {
          playClock.seek = reportedSeek;
          playClock.anchorPerf = now;
        }
        playClock.anchored = true;
        playClock.playing = playing;
        if (playing) {
          startPlayheadLoop();
        } else {
          stopPlayheadLoop();
          renderPlayhead(reportedSeek);
        }
      }

      function renderPlayhead(seek) {
        currentTimeEl.textContent = formatTime(seek);
        const dur = playClock.duration;
        updateProgress(dur > 0 ? (seek / dur) * 100 : 0);
      }

      function startPlayheadLoop() {
        if (rafId != null) return;
        const loop = () => {
          if (!playClock.playing) {
            rafId = null;
            return;
          }
          renderPlayhead(currentSeek());
          rafId = requestAnimationFrame(loop);
        };
        rafId = requestAnimationFrame(loop);
      }

      function stopPlayheadLoop() {
        if (rafId != null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      function handleVolumeOverlay(volumeObj, opts) {
        if (!volumeObj) return;
        const forceShow = !!(opts && opts.forceShow);
        const isMuted = !!volumeObj.is_muted;
        const value = typeof volumeObj.value === 'number' ? volumeObj.value : null;
        const min = typeof volumeObj.min === 'number' ? volumeObj.min : null;
        const max = typeof volumeObj.max === 'number' ? volumeObj.max : null;

        // Support both Roon dB (-80..0) and LMS percent (0..100) volume payloads.
        let percentage = null;
        const looksLikeDb =
          volumeObj.type === 'db' ||
          (typeof min === 'number' && min < 0) ||
          (typeof max === 'number' && max <= 0);

        if (value === null) return;

        if (looksLikeDb) {
          const dbMin = typeof min === 'number' ? min : -80;
          const dbMax = typeof max === 'number' ? max : 0;
          const range = dbMax - dbMin || 80;
          percentage = Math.max(0, Math.min(100, Math.round(((value - dbMin) / range) * 100)));
        } else {
          // Treat as linear percent (0..100), or scale from min/max if provided.
          if (typeof min === 'number' && typeof max === 'number' && max > min) {
            percentage = Math.max(0, Math.min(100, Math.round(((value - min) / (max - min)) * 100)));
          } else {
            percentage = Math.max(0, Math.min(100, Math.round(value)));
          }
        }
        
        // Only show overlay if volume actually changed (not on initial load), unless forceShow is requested.
        const volumeChanged = lastVolume !== null && (lastVolume !== percentage || lastMute !== isMuted);
        
        if (!forceShow && !volumeChanged && lastVolume === null) {
          // First load - just save the values without showing overlay
          lastVolume = percentage;
          lastMute = isMuted;
          return;
        }
        
        if (!forceShow && !volumeChanged) return;
        
        lastVolume = percentage;
        lastMute = isMuted;
        
        if (isMuted) {
          volumeIcon.textContent = '🔇';
          volumeValue.textContent = 'MUTED';
          volumeOverlay.classList.add('muted');
          volumeOverlay.classList.add('visible');
          clearTimeout(volumeTimer);
        } else {
          volumeIcon.textContent = percentage > 60 ? '🔊' : percentage > 0 ? '🔉' : '🔈';
          volumeValue.textContent = String(percentage);
          volumeOverlay.classList.remove('muted');
          volumeOverlay.classList.add('visible');
          clearTimeout(volumeTimer);
          volumeTimer = setTimeout(() => volumeOverlay.classList.remove('visible'), 2500);
        }
      }

      function setAlbumArt(imageUrl) {
        if (imageUrl) {
          const img = new Image();
          img.onload = () => {
            albumArt.src = imageUrl;
            albumArt.classList.add('loaded');
          };
          img.src = imageUrl;
        } else {
          albumArt.classList.remove('loaded');
          albumArt.removeAttribute('src');
        }
      }

      // `colorSource` is the copy of the cover that can actually be SAMPLED: an
      // embedded data URI where we have one, since a plain-http cover URL is
      // blocked outright on this HTTPS receiver and would yield no colour.
      function updateBackgroundSources(artistList, albumImage, colorSource) {
        const sampleFrom = colorSource || albumImage;
        if (rotationTimer) clearTimeout(rotationTimer);
        rotationTimer = null;
        rotationIndex = 0;
        // Pre-filter obvious thumbnail URLs. Anything borderline will be rejected after load by dimension checks.
        artistImages = Array.isArray(artistList)
          ? artistList
              .filter(Boolean)
              .map((u) => canonicalizeUrl(u))
              .filter((u) => !isLikelyLowResUrl(u))
          : [];
        console.log('[Receiver] updateBackgroundSources: got', artistImages.length, 'artist images');

        if (artistImages.length > 0) {
          // One image is the normal case now — the Core settles on a single Qobuz
          // portrait per artist deliberately, so nothing rotates and nothing
          // shuffles. A list only appears when several photographs are known.
          const single = artistImages.length === 1;
          rotationIndex = single ? 0 : Math.floor(Math.random() * artistImages.length);
          let failures = 0;

          const scheduleNext = () => {
            if (rotationTimer) clearTimeout(rotationTimer);
            rotationTimer = setTimeout(() => showNext(), BACKGROUND_ROTATION_MS);
          };

          // `firstShow` means "these are NEW sources, put one up now". It must not
          // be subject to the anti-pile-up wait below, and this is the bug that
          // made the artist photograph take about half a minute to appear
          // (reported 2026-09-01, introduced 2026-08-03).
          //
          // Every track change delivers TWO messages a fraction of a second
          // apart: the immediate one, which carries no artist images yet, and the
          // enriched one, which carries the portrait (measured on 1 Sep: the Core
          // sent both within the same second). The immediate one now paints the
          // blurred-artwork backdrop, and that starts an image load — so when the
          // portrait arrived milliseconds later, `bgLoadInProgress` was true and
          // the portrait was pushed onto the next ROTATION tick, a full 25
          // seconds away. Before the artwork backdrop existed the same branch
          // painted a colour, which loads nothing, so the portrait went up at
          // once; that is why this "used to be almost instant".
          //
          // A newly-arrived portrait should supersede a load already in flight,
          // which `setBackground` handles safely: it detaches the old image's
          // handlers and cancels its timeout, so the one it replaces can neither
          // paint nor report.
          const showNext = (firstShow = false) => {
            if (!artistImages.length) return;
            if (bgLoadInProgress && !firstShow) {
              // Don't pile up loads; retry on the next scheduled tick.
              return scheduleNext();
            }
            const url = artistImages[rotationIndex % artistImages.length];
            console.log('[Receiver] Showing artist image', (rotationIndex % artistImages.length) + 1, 'of', artistImages.length);
            rotationIndex = (rotationIndex + 1) % artistImages.length;
            setBackground(
              url,
              false,
              () => {
                // Every candidate refused (too small, or would not load). Leaving
                // the previous track's backdrop on screen is what made this look
                // like the display was showing another record; fall through to the
                // artwork.
                failures += 1;
                if (failures >= artistImages.length) {
                  console.warn('[Receiver] Artist images unusable, falling back to artwork backdrop');
                  setArtworkBackdrop(albumImage, sampleFrom);
                }
                scheduleNext();
              },
              { minWidth: MIN_BG_WIDTH, minHeight: MIN_BG_HEIGHT, reason: 'artist-bg' },
              () => {
                failures = 0;
                // A single settled portrait has nothing to swap to.
                if (!single) scheduleNext();
              }
            );
          };

          // Show immediately, then schedule the next swap 25s after.
          showNext(true);
        } else if (albumImage) {
          console.log('[Receiver] No artist images, using artwork backdrop');
          setArtworkBackdrop(albumImage, sampleFrom);
        } else {
          console.log('[Receiver] No images available, clearing background');
          clearBackground();
        }
      }

      // The Core's own "there is no artwork" answer, which must not be blurred
      // into a backdrop — it is a grey glyph, and enlarged it looks like a fault.
      function isPlaceholderArtwork(url) {
        return /^data:image\/svg/i.test(String(url || ''));
      }

      // No artist photograph: show the artwork itself, enlarged and blurred.
      //
      // This is what gives live radio a backdrop — a station's logo is the only
      // picture that exists for a stream, and a flat colour beside a small logo
      // left most of the screen empty. Falls back to the sampled colour when the
      // artwork is missing, a placeholder, or refuses to load (a plain-http cover
      // is blocked outright on this HTTPS receiver).
      function setArtworkBackdrop(albumImage, sampleFrom) {
        if (!albumImage || isPlaceholderArtwork(albumImage)) {
          return setColorBackdropFromAlbum(sampleFrom);
        }
        setBackground(
          albumImage,
          true,
          () => {
            console.warn('[Receiver] Artwork backdrop unusable, using colour');
            setColorBackdropFromAlbum(sampleFrom);
          },
          { reason: 'album-bg' }
        );
      }

      // Backdrop colour derived from the album cover, for when there is no
      // artist photograph. Sampling happens here rather than on the Core: the
      // cover is already in hand (usually as an embedded data URI, always
      // canvas-safe), and a colour cannot fail to load the way an image can.
      const albumColorCache = new Map();

      function albumBackdropColor(url) {
        const key = String(url || '');
        if (!key) return Promise.resolve(null);
        if (albumColorCache.has(key)) {
          return Promise.resolve(albumColorCache.get(key));
        }
        return new Promise((resolve) => {
          const img = new Image();
          if (!/^data:/i.test(key)) img.crossOrigin = 'anonymous';
          const done = (value) => {
            albumColorCache.set(key, value);
            resolve(value);
          };
          const timer = setTimeout(() => done(null), 6000);
          img.onerror = () => {
            clearTimeout(timer);
            done(null);
          };
          img.onload = () => {
            clearTimeout(timer);
            try {
              const size = 32;
              const canvas = document.createElement('canvas');
              canvas.width = size;
              canvas.height = size;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, size, size);
              const { data } = ctx.getImageData(0, 0, size, size);
              let r = 0, g = 0, b = 0, n = 0;
              for (let i = 0; i < data.length; i += 4) {
                const pr = data[i], pg = data[i + 1], pb = data[i + 2];
                const brightness = (pr * 299 + pg * 587 + pb * 114) / 1000;
                // Ignore near-black and near-white so a dark sleeve with a white
                // border doesn't average out to grey.
                if (brightness < 18 || brightness > 242) continue;
                r += pr; g += pg; b += pb; n += 1;
              }
              if (!n) return done(null);
              done({
                r: Math.round(r / n),
                g: Math.round(g / n),
                b: Math.round(b / n),
              });
            } catch (err) {
              // A cover served without CORS headers taints the canvas. Nothing
              // to recover — the neutral backdrop covers it.
              console.warn('[Receiver] Album colour unavailable:', err && err.message);
              done(null);
            }
          };
          img.src = key;
        });
      }

      // The Core sends `background_color` (it can read the cover's pixels; this
      // page cannot, because a Qobuz cover carries no CORS headers and taints a
      // canvas). Sampling here is only the fallback for an embedded cover.
      let coreBackdropColor = null;

      function parseHexColor(value) {
        const m = /^#?([0-9a-f]{6})$/i.exec(String(value || '').trim());
        if (!m) return null;
        const n = parseInt(m[1], 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }

      function setColorBackdropFromAlbum(albumImage) {
        const paint = (rgb) => {
          const base = rgb || { r: 26, g: 28, b: 33 };
          // Deepen it: this sits behind white text with the standard overlay on
          // top, so a bright average would wash the type out.
          const dim = (v, f) => Math.max(0, Math.min(255, Math.round(v * f)));
          const near = `rgb(${dim(base.r, 0.55)}, ${dim(base.g, 0.55)}, ${dim(base.b, 0.55)})`;
          const far = `rgb(${dim(base.r, 0.18)}, ${dim(base.g, 0.18)}, ${dim(base.b, 0.18)})`;
          const target = bgLayers[activeBackgroundLayer === 0 ? 1 : 0];
          const other = bgLayers[activeBackgroundLayer];
          target.style.backgroundImage = `radial-gradient(circle at 30% 25%, ${near} 0%, ${far} 70%, #08090b 100%)`;
          target.classList.remove('blurred');
          other.classList.remove('active');
          target.classList.add('active');
          activeBackgroundLayer = activeBackgroundLayer === 0 ? 1 : 0;
        };
        if (coreBackdropColor) return paint(coreBackdropColor);
        albumBackdropColor(albumImage).then(paint).catch(() => paint(null));
      }

      function setBackground(url, blurred = false, onError, opts, onSuccess) {
        const minWidth = opts && typeof opts.minWidth === 'number' ? opts.minWidth : 0;
        const minHeight = opts && typeof opts.minHeight === 'number' ? opts.minHeight : 0;
        const reason = opts && typeof opts.reason === 'string' ? opts.reason : '';
        const target = bgLayers[activeBackgroundLayer === 0 ? 1 : 0];
        const other = bgLayers[activeBackgroundLayer];
        const img = new Image();
        bgLoadInProgress = true;
        // Drop references to any previous in-flight load so it can be GC'd, and
        // cancel its timeout as well. Detaching the handlers alone left the timer
        // armed: twelve seconds after a load was superseded it would still fire,
        // clear the in-progress flag out from under the load that replaced it, and
        // run the SUPERSEDED caller's onError — which for the artwork backdrop
        // repaints a flat colour, wiping the artist portrait off the screen long
        // after it had settled.
        if (bgCurrentLoad) {
          try { bgCurrentLoad.onload = null; } catch {}
          try { bgCurrentLoad.onerror = null; } catch {}
        }
        if (bgCurrentLoadTimeout) {
          clearTimeout(bgCurrentLoadTimeout);
          bgCurrentLoadTimeout = null;
        }
        bgCurrentLoad = img;
        const loadTimeout = setTimeout(() => {
          try {
            console.warn('[Receiver] Background image load timeout, skipping:', url);
          } catch {}
          bgCurrentLoadTimeout = null;
          bgLoadInProgress = false;
          if (typeof onError === 'function') onError();
        }, 12000);
        bgCurrentLoadTimeout = loadTimeout;
        img.onload = () => {
          clearTimeout(loadTimeout);
          bgCurrentLoadTimeout = null;
          bgLoadInProgress = false;
          // Skip low-resolution backgrounds (primarily affects artist_images rotation).
          // For blurred album art we allow any size.
          if (!blurred && (img.naturalWidth < minWidth || img.naturalHeight < minHeight)) {
            // For artist backgrounds, allow smaller square portraits (e.g. 600x600) to keep rotation
            // from collapsing to a single image when only square sources (Deezer/iTunes) are available.
            // TVs will still look OK with a centered/zoomed 600px square; it's better than no rotation.
            const isSquareish = Math.abs(img.naturalWidth - img.naturalHeight) <= Math.max(40, Math.round(img.naturalWidth * 0.08));
            // 450, not 600: Qobuz's LARGEST artist portrait is about 550x546 —
            // /large/ is the biggest variant it serves (xlarge/original 403).
            // The old 600 floor therefore rejected every Qobuz portrait, and the
            // receiver fell back to blurred album art, which is what looked like
            // "the wrong album cover on the television".
            const squareOk = reason === 'artist-bg' && isSquareish && img.naturalWidth >= 450 && img.naturalHeight >= 450;
            if (squareOk) {
              // accept
            } else {
            console.warn(
              '[Receiver] Background image too small, skipping:',
              url,
              `(${img.naturalWidth}x${img.naturalHeight}, min ${minWidth}x${minHeight})`
            );
            if (typeof onError === 'function') onError();
            return;
            }
          }
          target.style.backgroundImage = `url('${url}')`;
          if (blurred) {
            target.classList.add('blurred');
          } else {
            target.classList.remove('blurred');
          }
          other.classList.remove('active');
          target.classList.add('active');
          activeBackgroundLayer = activeBackgroundLayer === 0 ? 1 : 0;
          if (typeof onSuccess === 'function') onSuccess();
        };
        img.onerror = () => {
          clearTimeout(loadTimeout);
          bgCurrentLoadTimeout = null;
          bgLoadInProgress = false;
          console.warn('[Receiver] Background image failed to load:', url);
          if (typeof onError === 'function') onError();
        };
        img.src = url;
      }

      function clearBackground() {
        bgLayers.forEach((layer) => {
          layer.style.backgroundImage = 'none';
          layer.classList.remove('active');
        });
      }

      function updateProgress(progress) {
        const pct = Math.min(100, Math.max(0, progress));
        if (currentBars) {
          drawWaveform(pct);
        } else {
          progressBar.style.width = `${pct}%`;
        }
      }

      // Accept/replace the per-track waveform bars from a NOW_PLAYING payload.
      // Bars are normalized 0..1. Toggles between the plain progress bar and the
      // waveform; payloads can arrive in stages, so this runs on every update.
      function setWaveform(payload) {
        const wf = payload && payload.waveform;
        const bars =
          wf && Array.isArray(wf.bars) && wf.bars.length ? wf.bars : null;
        currentBars = bars;
        if (bars) {
          if (waveformCanvas) waveformCanvas.classList.remove('hidden');
          if (progressContainer) progressContainer.classList.add('hidden');
        } else {
          if (waveformCanvas) waveformCanvas.classList.add('hidden');
          if (progressContainer) progressContainer.classList.remove('hidden');
        }
      }

      function drawWaveform(progressPct) {
        if (!waveformCtx || !waveformCanvas || !currentBars) return;
        const dpr = window.devicePixelRatio || 1;
        const cssW = waveformCanvas.clientWidth;
        const cssH = waveformCanvas.clientHeight;
        if (!cssW || !cssH) return; // not laid out yet; will redraw next tick
        if (waveformCanvas.width !== Math.round(cssW * dpr)) {
          waveformCanvas.width = Math.round(cssW * dpr);
          waveformCanvas.height = Math.round(cssH * dpr);
        }
        const ctx = waveformCtx;
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, cssW, cssH);
        const n = currentBars.length;
        const slot = cssW / n;
        const barW = Math.max(1.5, slot * 0.6);
        const mid = cssH / 2;
        const maxBar = cssH * 0.92;
        const playedTo = (Math.min(100, Math.max(0, progressPct)) / 100) * cssW;
        for (let i = 0; i < n; i += 1) {
          const x = i * slot + (slot - barW) / 2;
          const v = Math.max(0, Math.min(1, currentBars[i] || 0));
          const h = Math.max(2, v * maxBar);
          const played = x + barW / 2 <= playedTo;
          ctx.fillStyle = played
            ? 'rgba(255, 255, 255, 0.95)'
            : 'rgba(255, 255, 255, 0.32)';
          ctx.fillRect(x, mid - h / 2, barW, h);
        }
        ctx.restore();
      }

      function formatTime(seconds) {
        const safe = Math.max(0, Math.floor(seconds || 0));
        const mins = Math.floor(safe / 60)
          .toString()
          .padStart(1, '0');
        const secs = Math.floor(safe % 60)
          .toString()
          .padStart(2, '0');
        return `${mins}:${secs}`;
      }

      function resetDisplay() {
        // Hide the entire bottom bar for blank screen
        bottomBar.classList.add('hidden');
        // Paused/idle reads the same in every display style, except the clock.
        if (!keepClockOnIdle()) hideDisplayStyle();

        if (notPlayingContainer) {
          notPlayingContainer.classList.remove('hidden');
          // No branded "Lyr" wordmark placeholder — keep the idle/no-artwork
          // screen clean (blank) so it never shows where artwork should be.
          if (notPlayingTitle) notPlayingTitle.textContent = '';
        }
        
        titleEl.textContent = '';
        artistEl.textContent = '';
        currentTimeEl.textContent = '0:00';
        durationEl.textContent = '0:00';
        albumArt.classList.remove('loaded');
        albumArt.removeAttribute('src');
        updateBackgroundSources([], null);
        setWaveform(null);
        updateProgress(0);
        stopPlayback();
      }

      function stopPlayback() {
        stopPlayheadLoop();
        playClock.playing = false;
        playClock.anchored = false;
        if (rotationTimer) {
          clearTimeout(rotationTimer);
          rotationTimer = null;
        }
        lastPayload = null;
      }

      // NOTE: do not call context.start() twice (can cause odd CAF behavior / default UI)
    </script>
  </body>
</html>
